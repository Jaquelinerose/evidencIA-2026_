<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>_evidenciaIA-2026 | La Salle</title>
    <script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdn.jsdelivr.net/npm/lucide-static@0.344.0/font/lucide.min.css" rel="stylesheet">
    <style>
        @font-face { font-family: 'Century Gothic'; src: local('Century Gothic'), sans-serif; }
        .font-century { font-family: 'Century Gothic', sans-serif; }
        .yellow-page {
            background-color: #fef9c3;
            background-image: linear-gradient(#eab308 1px, transparent 1px), linear-gradient(90deg, #eab308 1px, transparent 1px);
            background-size: 30px 30px;
        }
        .notebook-margin { border-left: 2px solid #ef4444; margin-left: clamp(20px, 5vw, 60px); padding-left: 24px; }
    </style>
</head>
<body>
    <div id="root"></div>

    <script type="text/babel">
        const { useState, useEffect } = React;

        // --- CONFIGURACIÓN (RELLENA ESTO) ---
        const apiKeyGemini = "TU_API_KEY_AQUÍ"; 
        
        function App() {
            const [formData, setFormData] = useState({ estudiante: '', area: 'Matemática', alerta: 'VERDE', observacion: '' });
            const [logs, setLogs] = useState([]);

            const handleSave = () => {
                if(!formData.estudiante || !formData.observacion) return alert("Llena todos los campos");
                const nuevoLog = { ...formData, id: Date.now(), fecha: new Date().toLocaleDateString() };
                setLogs([nuevoLog, ...logs]);
                setFormData({ estudiante: '', area: 'Matemática', alerta: 'VERDE', observacion: '' });
            };

            return (
                <div className="min-h-screen bg-slate-300 p-4 md:p-8 flex justify-center font-century">
                    <div className="w-full max-w-5xl yellow-page shadow-2xl min-h-screen flex flex-col border border-slate-400 relative">
                        <header className="pt-12 px-8 pb-6">
                            <div className="notebook-margin">
                                <h1 className="text-2xl font-black text-blue-900">LA SALLE - LA PAZ</h1>
                                <h3 className="text-4xl font-black text-red-600 italic mt-4 uppercase">evidencIA 2026</h3>
                                
                                <div className="mt-8 bg-white/80 p-6 rounded-2xl border border-yellow-600/30 shadow-lg">
                                    <div className="grid grid-cols-1 md:grid-cols-2 gap-4">
                                        <input 
                                            className="border-b-2 border-slate-400 bg-transparent p-2 outline-none font-bold"
                                            placeholder="Nombre del Estudiante"
                                            value={formData.estudiante}
                                            onChange={e => setFormData({...formData, estudiante: e.target.value})}
                                        />
                                        <select 
                                            className="p-2 rounded border"
                                            value={formData.area}
                                            onChange={e => setFormData({...formData, area: e.target.value})}
                                        >
                                            <option>Matemática</option>
                                            <option>Lenguaje</option>
                                            <option>Ciencias Naturales</option>
                                        </select>
                                        <textarea 
                                            className="md:col-span-2 p-3 border rounded h-24"
                                            placeholder="Observación técnica..."
                                            value={formData.observacion}
                                            onChange={e => setFormData({...formData, observacion: e.target.value})}
                                        ></textarea>
                                        <button 
                                            onClick={handleSave}
                                            className="md:col-span-2 bg-blue-900 text-white p-3 rounded-xl font-black hover:bg-blue-800 transition-all"
                                        >
                                            GUARDAR EVIDENCIA
                                        </button>
                                    </div>
                                </div>
                            </div>
                        </header>

                        <main className="p-8">
                            <div className="notebook-margin space-y-8">
                                {logs.map(log => (
                                    <div key={log.id} className="border-b border-yellow-900/10 pb-4">
                                        <h4 className="text-xl font-black">{log.estudiante} <span className="text-sm font-normal text-slate-500">- {log.fecha}</span></h4>
                                        <p className="italic text-slate-700">"{log.observacion}"</p>
                                        <div className="mt-2 text-xs font-bold text-blue-800 uppercase">Área: {log.area}</div>
                                    </div>
                                ))}
                            </div>
                        </main>
                    </div>
                </div>
            );
        }

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
